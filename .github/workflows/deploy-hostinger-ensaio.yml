# DEPLOY HOSTINGER — ENSAIO (Lote 3). Repositório de ENSAIO com imagens SINTÉTICAS. Nada operacional, nenhuma VPS, nenhuma credencial AWS.
# Reproduz a semântica do Deploy AWS original: push na main (só o que mudou), disparo manual (tudo), agendamento de recuperação (tudo), concorrência 1 por vez.
# Em vez de publicar na Hostinger, o job final VERIFICA (com o código do agente e o cosign REAL) o que acabou de ser publicado no GHCR.
name: Deploy Hostinger (ENSAIO)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule (cron diário 0 4 * * *, tratado como dispatch no Deploy AWS) FICA FORA do ensaio: evita execução não assistida e consumo contínuo; a semântica é idêntica à do disparo manual.

concurrency:
  group: deploy-hostinger-ensaio
  cancel-in-progress: false

permissions: {}   # nada por padrão: cada job declara o mínimo

env:
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256_LINUX_AMD64: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"   # do cosign_checksums.txt da v3.1.4 (release imutável, verificado com `gh release verify`)

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: f
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|schedule) echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          git fetch --tags --force --quiet || true
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then PADRAO="HEAD^"; else PADRAO="$BEFORE"; fi
          base_de() { if git rev-parse -q --verify "refs/tags/$1" >/dev/null && git merge-base --is-ancestor "$1" HEAD 2>/dev/null; then echo "refs/tags/$1"; else echo "$PADRAO"; fi; }
          mudou() { git diff --name-only "$1" HEAD 2>/dev/null | grep -q "^$2"; }
          if mudou "$(base_de deployed/api)" 'ensaio/api/'; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if mudou "$(base_de deployed/web)" 'ensaio/web/'; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  build-api:
    name: Build API (imagem sintética)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.b.outputs.digest }}", nome: "${{ steps.n.outputs.nome }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - id: n
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ensaio-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - id: b
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ./ensaio/api
          push: true
          provenance: false   # a proveniência é a do GitHub (atestado abaixo), não a do BuildKit
          sbom: false
          tags: ${{ steps.n.outputs.nome }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ steps.n.outputs.nome }}
          subject-digest: ${{ steps.b.outputs.digest }}
          push-to-registry: true

  build-web:
    name: Build Web (imagem sintética)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.b.outputs.digest }}", nome: "${{ steps.n.outputs.nome }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - id: n
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ensaio-web" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - id: b
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ./ensaio/web
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.n.outputs.nome }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ steps.n.outputs.nome }}
          subject-digest: ${{ steps.b.outputs.digest }}
          push-to-registry: true

  publicar-ponteiro:
    name: Publicar ponteiro (manifesto OCI com anotações)
    needs: [changes, build-api, build-web]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-api.result == 'success' || needs.build-web.result == 'success') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.b.outputs.digest }}", nome: "${{ steps.n.outputs.nome }}", criado: "${{ steps.t.outputs.criado }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - id: n
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ensaio-release" >> "$GITHUB_OUTPUT"
      - id: t
        run: echo "criado=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - id: b
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ./ensaio/ponteiro
          push: true
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,oci-mediatypes=true
          tags: |
            ${{ steps.n.outputs.nome }}:prod
            ${{ steps.n.outputs.nome }}:run-${{ github.run_id }}
          # HIPÓTESE A VALIDAR NO ENSAIO: estas anotações de MANIFESTO viram o ponteiro (somente os serviços que MUDARAM entram)
          annotations: |
            manifest:br.protagonize.esquema=1
            manifest:br.protagonize.seq=${{ github.run_id }}
            manifest:br.protagonize.commit=${{ github.sha }}
            manifest:br.protagonize.criado_em=${{ steps.t.outputs.criado }}
            manifest:br.protagonize.gatilho=${{ github.event_name }}
            manifest:br.protagonize.tipo=release
            ${{ needs.build-api.outputs.digest != '' && format('manifest:br.protagonize.api={0}', needs.build-api.outputs.digest) || '' }}
            ${{ needs.build-web.outputs.digest != '' && format('manifest:br.protagonize.web={0}', needs.build-web.outputs.digest) || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ steps.n.outputs.nome }}
          subject-digest: ${{ steps.b.outputs.digest }}
          push-to-registry: true

  verificar-publicado:
    name: Verificar o publicado (agente + cosign REAL)
    needs: [publicar-ponteiro, build-api, build-web]
    if: ${{ !cancelled() && needs.publicar-ponteiro.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Baixar e conferir o cosign (versão FIXA, checksum conferido)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256_LINUX_AMD64}  /tmp/cosign" | sha256sum -c -
          chmod 755 /tmp/cosign
          /tmp/cosign version | grep -E "GitVersion|GitCommit"
      - name: Diagnóstico do formato do atestado no GHCR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PONTEIRO_DIGEST: ${{ needs.publicar-ponteiro.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
        run: python3 ci/diagnostico.py
      - name: Verificar ponteiro e imagens como o agente faria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PONTEIRO_DIGEST: ${{ needs.publicar-ponteiro.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: python3 ci/ci_verificar.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with: { name: evidencias-verificacao, path: evidencias/, if-no-files-found: ignore }
