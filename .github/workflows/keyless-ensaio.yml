# ENSAIO (Lote 3) — alternativa B: cosign KEYLESS. Mesmas semânticas do workflow principal; atestado assinado com o OIDC do Actions (Sigstore público).
name: Keyless (ENSAIO)
on:
  workflow_dispatch:
concurrency:
  group: keyless-ensaio
  cancel-in-progress: false
permissions: {}
env:
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256_LINUX_AMD64: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
jobs:
  publicar:
    name: Construir, publicar e assinar (keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      ponteiro: ${{ steps.pt.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: cosign fixo e conferido
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256_LINUX_AMD64}  /tmp/cosign" | sha256sum -c -
          chmod 755 /tmp/cosign
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - id: nomes
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "criado=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with: { context: ./ensaio/api, push: true, provenance: false, sbom: false, tags: "${{ steps.nomes.outputs.base }}/ensaio-k-api:${{ github.sha }}-${{ github.run_id }}" }
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with: { context: ./ensaio/web, push: true, provenance: false, sbom: false, tags: "${{ steps.nomes.outputs.base }}/ensaio-k-web:${{ github.sha }}-${{ github.run_id }}" }
      - name: Atestar as imagens (keyless)
        run: |
          ci/assinar.sh "${{ steps.nomes.outputs.base }}/ensaio-k-api@${{ steps.api.outputs.digest }}"
          ci/assinar.sh "${{ steps.nomes.outputs.base }}/ensaio-k-web@${{ steps.web.outputs.digest }}"
      - name: Assinatura simples por digest + verificação online com identidade
        run: |
          set -euo pipefail
          /tmp/cosign sign --yes "${{ steps.nomes.outputs.base }}/ensaio-k-api@${{ steps.api.outputs.digest }}"
          /tmp/cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/keyless-ensaio.yml@${GITHUB_REF}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${{ steps.nomes.outputs.base }}/ensaio-k-api@${{ steps.api.outputs.digest }}" > /tmp/verify-simples.json
          python3 -c "import json;d=json.load(open('/tmp/verify-simples.json'));print('assinaturas verificadas:',len(d))"
      - id: pt
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ./ensaio/ponteiro
          push: true
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,oci-mediatypes=true
          tags: |
            ${{ steps.nomes.outputs.base }}/ensaio-k-release:prod
            ${{ steps.nomes.outputs.base }}/ensaio-k-release:run-${{ github.run_id }}
          annotations: |
            manifest:br.protagonize.esquema=1
            manifest:br.protagonize.seq=${{ github.run_id }}
            manifest:br.protagonize.commit=${{ github.sha }}
            manifest:br.protagonize.criado_em=${{ steps.nomes.outputs.criado }}
            manifest:br.protagonize.gatilho=${{ github.event_name }}
            manifest:br.protagonize.tipo=release
            manifest:br.protagonize.api=${{ steps.api.outputs.digest }}
            manifest:br.protagonize.web=${{ steps.web.outputs.digest }}
      - name: Atestar o ponteiro por último
        run: ci/assinar.sh "${{ steps.nomes.outputs.base }}/ensaio-k-release@${{ steps.pt.outputs.digest }}"

  verificar:
    name: Verificar (agente + cosign REAL, offline com raiz fixada)
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: cosign fixo e conferido
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256_LINUX_AMD64}  /tmp/cosign" | sha256sum -c -
          chmod 755 /tmp/cosign
      - name: Verificar como o agente faria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PONTEIRO_DIGEST: ${{ needs.publicar.outputs.ponteiro }}
          API_DIGEST: ${{ needs.publicar.outputs.api }}
          WEB_DIGEST: ${{ needs.publicar.outputs.web }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          PREFIXO_IMAGEM: ensaio-k
          WORKFLOW_PATH: .github/workflows/keyless-ensaio.yml
          NOME_RESULTADO: resultado-keyless.json
        run: python3 ci/ci_verificar.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with: { name: evidencias-keyless, path: evidencias/, if-no-files-found: ignore }
